plugins { id 'com.android.application' }

def webAssets = layout.buildDirectory.dir('generated/webAssets')
def syncWebAssets = tasks.register('syncWebAssets', Sync) {
    from(rootProject.projectDir.parentFile) {
        include 'index.html', '*.css', 'app.js', 'game.js', 'wallet.js', 'reference-tickets.js', 'scratch-gesture.js'
        include 'assets/*.png'
    }
    into(webAssets.map { it.dir('www') })
}

android {
    namespace 'com.haoyun.scratch'
    compileSdk 35
    defaultConfig {
        applicationId 'com.haoyun.scratch'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    buildFeatures { buildConfig true }
    sourceSets.main.assets.srcDir(webAssets)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
tasks.named('preBuild').configure { dependsOn(syncWebAssets) }

dependencies {
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.14.0'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:core:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
